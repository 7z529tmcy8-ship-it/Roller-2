<title>RollerCheck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Vollbild-Karte, darüber Start/Ziel-Karte, unten ein Blatt mit Ergebnissen (am Desktop links als Seitenleiste). */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --fg:#111114; --muted:#6c6c72; --accent:#0a84ff; --on-accent:#ffffff;
  --glass:rgba(250,250,252,.84); --edge:rgba(255,255,255,.65); --cell:#ffffff; --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.14);
  --shadow:0 8px 30px rgba(0,0,0,.16);
  --land:#f0eee8; --park:#d3e8c2; --water:#a9d3f2; --road:#ffffff; --roadline:#dcd9d0; --label:#4a4a4f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fg:#f5f5f7; --muted:#9b9ba3; --accent:#0a84ff;
    --glass:rgba(32,32,35,.82); --edge:rgba(255,255,255,.09); --cell:#2c2c2f; --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.3);
    --shadow:0 8px 30px rgba(0,0,0,.5);
    --land:#222225; --park:#1f3a2b; --water:#1c3a52; --road:#3b3b3f; --roadline:#2c2c2f; --label:#c9c9cf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fg:#f5f5f7; --muted:#9b9ba3; --accent:#0a84ff;
  --glass:rgba(32,32,35,.82); --edge:rgba(255,255,255,.09); --cell:#2c2c2f; --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.3);
  --shadow:0 8px 30px rgba(0,0,0,.5);
  --land:#222225; --park:#1f3a2b; --water:#1c3a52; --road:#3b3b3f; --roadline:#2c2c2f; --label:#c9c9cf;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--land);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;min-height:560px;overflow:hidden;background:var(--land)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map:active{cursor:grabbing}
.ui{position:absolute;inset:0;pointer-events:none}
.card{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:.5px solid var(--edge);box-shadow:var(--shadow)}

/* Oben: Start und Ziel */
.top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.toprow>*{pointer-events:auto}
.search{border-radius:18px;padding:6px 6px 8px}
.rows{position:relative}
.srow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 52px 9px 10px;border-radius:12px}
.srow[aria-pressed="true"]{background:var(--fill)}
.srow .lab{color:var(--muted);font-size:13px;width:38px;flex:none}
.srow .val{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow svg{flex:none}
.rows .line{height:.5px;background:var(--sep);margin:0 10px 0 40px}
.swap{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:4px 6px 2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tip{margin:6px 10px 0;font-size:12px;color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:5px 9px 6px;border-radius:9px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-size:11px;font-weight:600;color:var(--label)}
.scale i{display:block;height:5px;border:1.5px solid var(--label);border-top:0;min-width:4px}
.fabs{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fabgrp{display:flex;flex-direction:column;border-radius:13px;overflow:hidden}
.fabgrp button,.fab{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.fabgrp button+button{border-top:.5px solid var(--sep)}
.fab{border-radius:13px}

/* Unten: Ergebnisse */
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;border-radius:22px 22px 0 0;transition:height .32s cubic-bezier(.2,.8,.2,1);pointer-events:auto;overflow:hidden}
.sheet.dragging{transition:none}
.stop{touch-action:none;flex:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.grab{display:block;width:100%;height:22px;border:0;background:transparent;padding:0}
.grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--sep);margin:9px auto 0;filter:brightness(.8)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
.head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.head .htxt{min-width:0}
.head .htxt p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:8px;flex:none}
.round{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:17px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:16px;padding:8px 2px;display:inline-flex;align-items:center;gap:2px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;background:var(--fill);height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.group{background:var(--cell);border-radius:14px;overflow:hidden;list-style:none;margin:0;padding:0}
.group>li+li,.group>div+div{border-top:.5px solid var(--sep)}
.row-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 14px 8px;border:0;background:transparent;text-align:left}
.rank{width:34px;height:34px;border-radius:50%;background:var(--pc);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:16px}
.who b{display:block;font-size:16px;font-weight:600}
.who small{color:var(--muted);font-size:13px}
.best{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:2px 6px;border-radius:5px;margin-left:8px;vertical-align:2px}
.nums{text-align:right}
.price{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.nums small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.eff{display:flex;align-items:center;gap:10px;padding:0 14px 12px 60px}
.track{flex:1;height:5px;background:var(--fill);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.eff span{font-size:12px;color:var(--muted);min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.detail{padding:2px 14px 14px;display:grid;gap:10px;font-size:14px}
.calc{list-style:none;margin:0;padding:10px 0 0;display:grid;gap:7px;border-top:.5px solid var(--sep)}
.calc li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.calc span{color:var(--muted)}
.calc b{font-weight:600;font-variant-numeric:tabular-nums}
.go{display:block;text-align:center;background:var(--accent);color:var(--on-accent);padding:13px;border-radius:13px;font-weight:600;font-size:16px;text-decoration:none}
.hint{margin:0;font-size:12px;color:var(--muted)}
.row.sel{background:color-mix(in srgb,var(--accent) 7%,var(--cell))}
.empty{background:var(--cell);border-radius:14px;padding:18px;color:var(--muted);display:grid;gap:12px;justify-items:start}
.note{margin:12px 2px 0;font-size:13px;color:var(--muted)}
.btn{border:0;background:var(--fill);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px}
h3{margin:18px 4px 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.frow{display:flex;align-items:center;gap:12px;padding:11px 14px}
.frow .dot,.dot{width:14px;height:14px;border-radius:50%;flex:none}
.frow span{flex:1;font-size:16px;font-weight:500}
.sw{width:51px;height:31px;border-radius:999px;border:0;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:#34c759}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.segm{display:flex;gap:3px;background:var(--fill);padding:3px;border-radius:11px}
.segm button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600}
.segm button[aria-pressed="true"]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.prow{padding:12px 14px 10px;display:grid;gap:8px}
.pr-top{display:flex;align-items:center;gap:8px}
.pr-top b{font-size:16px}
.st{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--muted)}
.st-ok{background:color-mix(in srgb,#34c759 22%,transparent);color:#1f8a3d}
.st-user{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.st-none{background:color-mix(in srgb,#ff9f0a 22%,transparent);color:#b36b00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-ok{color:#5fd37c}:root:not([data-theme="light"]) .st-none{color:#ffb454}}
:root[data-theme="dark"] .st-ok{color:#5fd37c}
:root[data-theme="dark"] .st-none{color:#ffb454}
.pr-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr-in label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.pr-in input{width:100%;min-width:0;border:0;background:var(--fill);border-radius:9px;padding:9px 10px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.prow .nt{margin:0;font-size:12px;color:var(--muted)}
.srcs{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.srcs a{color:var(--accent)}
.callout{background:var(--cell);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}
.callout b{color:var(--fg)}

@media (min-width:900px){
  .ui{display:grid;grid-template-columns:392px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .top{display:contents}
  .search{grid-column:1;grid-row:1}
  .toprow{grid-column:2;grid-row:1;align-self:start}
  .sheet{position:relative;left:auto;right:auto;bottom:auto;grid-column:1;grid-row:2;height:auto!important;max-height:100%;align-self:start;border-radius:18px}
  .grab{display:none}
  .stop{padding-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <svg id="map" role="img" aria-label="Schematische Karte von Hannover mit E-Rollern" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="ui">
    <div class="top">
      <section class="search card" id="search" aria-label="Start und Ziel">
        <div class="rows">
          <button type="button" class="srow" data-row="start" aria-pressed="false"><span id="ico-start"></span><span class="lab">Start</span><span class="val" id="v-start"></span></button>
          <div class="line"></div>
          <button type="button" class="srow" data-row="dest" aria-pressed="true"><span id="ico-dest"></span><span class="lab">Ziel</span><span class="val" id="v-dest"></span></button>
          <button type="button" class="swap" id="swap" aria-label="Start und Ziel tauschen"></button>
        </div>
        <div class="sugg" id="chips" role="group" aria-label="Orte"></div>
        <p class="tip" id="tip"></p>
      </section>
      <div class="toprow">
        <div class="scale" id="scale"><span></span><i></i></div>
        <div class="fabs">
          <div class="fabgrp card"><button type="button" id="zoom-in" aria-label="Hineinzoomen"></button><button type="button" id="zoom-out" aria-label="Herauszoomen"></button></div>
          <button type="button" class="fab card" id="zoom-fit" aria-label="Ausschnitt auf Start und Ziel anpassen"></button>
        </div>
      </div>
    </div>
    <section class="sheet card" id="sheet" aria-label="Vergleich der Anbieter">
      <div class="stop" id="stop">
        <button type="button" class="grab" id="grab" aria-label="Liste vergrößern oder verkleinern"><i></i></button>
        <div id="shead"></div>
      </div>
      <div class="sbody" id="sbody"></div>
    </section>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var app = $('#app'), svg = $('#map'), sheet = $('#sheet'), sbody = $('#sbody'), shead = $('#shead'), search = $('#search');

  /* ---------- Karte: Hannover, schematisch. 1 Einheit = 10 m, 100 Einheiten = 1 km ---------- */
  var BB = {latMax:52.405, latMin:52.340, lngMin:9.675, lngMax:9.790};
  var W = 780, H = 720, PX_KM = 100;
  function toXY(lat, lng){ return [(lng-BB.lngMin)/(BB.lngMax-BB.lngMin)*W, (BB.latMax-lat)/(BB.latMax-BB.latMin)*H]; }

  var WALK_KMH = 5, RIDE_KMH = 16, DETOUR_W = 1.25, DETOUR_R = 1.3;

  /* ---------- Anbieter und Preise (recherchiert, Stand Okt/Nov 2026) ----------
     conf: ok = aus offenen Anbieter-Daten für Hannover, guess = Annahme, none = unbekannt, user = von dir */
  var P = [
    {id:'dott', name:'Dott', color:'#14b8a6', on:'#ffffff', unlock:1.00, perMin:0.29, conf:'ok', url:'https://ridedott.com',
      note:'Hannover-Tarif aus den offenen Dott-Daten (laut scootradar.com). dealdoktor.de nennt dieselben Werte.'},
    {id:'voi', name:'Voi', color:'#ff453a', on:'#ffffff', unlock:0.00, perMin:0.22, conf:'ok', url:'https://www.voi.com',
      note:'Hannover-Tarif aus den offenen Voi-Daten (laut scootradar.com). Andere Seiten nennen allgemein 1 € und 0,15 €, das gilt wohl nicht für Hannover.'},
    {id:'lime', name:'Lime', color:'#34c759', on:'#0b2b12', unlock:1.00, perMin:0.23, conf:'guess', url:'https://www.li.me',
      note:'Kein Hannover-Preis gefunden. Quellen nennen deutschlandweit etwa 1 € und 0,20–0,25 € pro Minute. Ich rechne mit 0,23 €.'},
    {id:'bolt', name:'Bolt', color:'#ffb020', on:'#2a1b00', unlock:1.00, perMin:0.23, conf:'guess', url:'https://bolt.eu',
      note:'Kein Hannover-Preis gefunden. Die Quellen widersprechen sich (0 € + 0,15 € gegen 0,99 € + 0,22–0,24 €). Ich rechne mit marktüblichen 1 € + 0,23 €.'},
    {id:'ryde', name:'Ryde', color:'#af52de', on:'#ffffff', unlock:null, perMin:null, conf:'none', url:'https://apps.apple.com/de/app/ryde-immer-in-der-n%C3%A4he/id1495605028',
      note:'Ryde fährt laut Stadt Hannover in der Stadt, die App ist aktuell. Einen Preis habe ich nicht gefunden. Trag ihn ein, wenn du ihn in der App siehst.'}
  ];
  P.forEach(function(p){ p.def = {unlock:p.unlock, perMin:p.perMin, conf:p.conf}; });
  function pById(id){ return P.filter(function(p){ return p.id===id; })[0]; }
  function priced(p){ return p.unlock!=null && p.perMin!=null; }

  var LM = [
    {id:'hbf',     name:'Hauptbahnhof',      lat:52.3765, lng:9.7410, a:'start'},
    {id:'rathaus', name:'Neues Rathaus',     lat:52.3678, lng:9.7385, a:'start'},
    {id:'uni',     name:'Uni Welfengarten',  lat:52.3822, lng:9.7178, a:'start'},
    {id:'herren',  name:'Herrenhausen',      lat:52.3905, lng:9.6935, a:'start'},
    {id:'linden',  name:'Linden-Mitte',      lat:52.3695, lng:9.7165, a:'end'},
    {id:'lister',  name:'Lister Platz',      lat:52.3858, lng:9.7633, a:'start'},
    {id:'masch',   name:'Maschsee Nordufer', lat:52.3585, lng:9.7405, a:'start'}
  ].map(function(l){ l.xy = toXY(l.lat, l.lng); return l; });
  function lm(id){ return LM.filter(function(l){ return l.id===id; })[0]; }

  var LAKE = (function(){ var c = toXY(52.349, 9.7435); return {cx:c[0], cy:c[1], rx:22, ry:115, rot:-12}; })();
  function inLake(x, y){
    var a = LAKE.rot*Math.PI/180, dx = x-LAKE.cx, dy = y-LAKE.cy;
    var lx = dx*Math.cos(a)+dy*Math.sin(a), ly = -dx*Math.sin(a)+dy*Math.cos(a);
    return (lx*lx)/((LAKE.rx+8)*(LAKE.rx+8)) + (ly*ly)/((LAKE.ry+8)*(LAKE.ry+8)) < 1;
  }

  /* ---------- Beispiel-Roller (ausgedacht, feste Zufallszahlen) ---------- */
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  var rnd = mulberry32(20261121);
  function gauss(){ var u=0; while(!u) u=rnd(); var v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  var CLUSTERS = [
    [52.3765,9.7410,.70,26],[52.3705,9.7350,.65,16],[52.3822,9.7178,.50,9],[52.3695,9.7165,.50,9],
    [52.3858,9.7633,.60,10],[52.3585,9.7405,.55,9],[52.3905,9.6935,.50,4]
  ];
  var WTS = [['dott',.22],['voi',.24],['lime',.24],['bolt',.18],['ryde',.12]];
  function pickProvider(){
    var r = rnd(), acc = 0;
    for(var i=0;i<WTS.length;i++){ acc += WTS[i][1]; if(r<acc) return pById(WTS[i][0]); }
    return P[0];
  }
  var scooters = [], nextId = 1;
  CLUSTERS.forEach(function(c){
    var cxy = toXY(c[0], c[1]), n = 0, guard = 0;
    while(n < c[3] && guard++ < 500){
      var x = cxy[0]+gauss()*c[2]*PX_KM, y = cxy[1]+gauss()*c[2]*PX_KM;
      if(x<12||x>W-12||y<12||y>H-12||inLake(x,y)) continue;
      scooters.push({id:nextId++, xy:[x,y], p:pickProvider(), bat:25+Math.floor(rnd()*74)});
      n++;
    }
  });
  (function(){
    var s0 = lm('hbf').xy;
    P.forEach(function(p){
      var has = scooters.some(function(s){ return s.p===p && Math.hypot(s.xy[0]-s0[0], s.xy[1]-s0[1]) < 70; });
      if(!has){
        var ang = rnd()*Math.PI*2, r = 30+rnd()*38;
        scooters.push({id:nextId++, xy:[s0[0]+Math.cos(ang)*r, s0[1]+Math.sin(ang)*r], p:p, bat:40+Math.floor(rnd()*55)});
      }
    });
  })();

  /* ---------- Zustand ---------- */
  var SORTS = [['mix','Bester Mix'],['cheap','Günstigste'],['fast','Schnellste'],['walk','Kürzester Fußweg']];
  var SCORE_LBL = {mix:'Effizienz', cheap:'Preis-Score', fast:'Zeit-Score', walk:'Nähe-Score'};
  var state = {
    start: lm('hbf').xy.slice(), startLabel: 'Hauptbahnhof',
    dest: lm('masch').xy.slice(), destLabel: 'Maschsee Nordufer',
    active: 'dest', sort: 'mix', view: 'results', sel: null,
    provs: {dott:true, voi:true, lime:true, bolt:true, ryde:true}, maxWalk: 12, minBat: 0
  };
  var res = {cands:[], best:[], missing:[]};

      var oor = res.missing.filter(function(p){ return !(live.on && !live.ok[p.id]); });
      if(oor.length) h += '<p class="note">Nicht in Reichweite: '+nameList(oor)+'.</p>';
      if(nc.length) h += '<p class="note">Noch nicht angebunden: '+nameList(nc)+'.</p>';
    }
    h += live.on
      ? '<p class="note">Live-Daten von '+(live.names.join(', ')||'keinem Anbieter')+', Stand '+live.at.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr. Die Preise stehen unter „€“.</p>'
      : '<p class="note">Demo: Positionen und Akkustände der Roller sind ausgedacht, gerade sind keine Live-Daten erreichbar. Die Preise stehen unter „€“.</p>';
    return h;
  }
  function filterHTML(){
    var h = '<h3>Anbieter</h3><div class="group">'+P.map(function(p){
      return '<div class="frow"><i class="dot" style="background:'+p.color+'"></i><span>'+p.name+'</span>'
        +'<button type="button" class="sw" role="switch" aria-checked="'+state.provs[p.id]+'" aria-label="'+p.name+' anzeigen" data-act="toggle" data-id="'+p.id+'" data-k="sw-'+p.id+'"></button></div>';
    }).join('')+'</div>';
    h += '<h3>Maximaler Fußweg zum Roller</h3><div class="segm" role="group">'+[3,5,8,12].map(function(m){
      return '<button type="button" data-act="walk" data-v="'+m+'" data-k="walk-'+m+'" aria-pressed="'+(state.maxWalk===m)+'">'+m+' Min</button>';
    }).join('')+'</div>';
    h += '<h3>Mindest-Akku</h3><div class="segm" role="group">'+[[0,'Egal'],[20,'20 %'],[40,'40 %'],[60,'60 %']].map(function(m){
      return '<button type="button" data-act="bat" data-v="'+m[0]+'" data-k="bat-'+m[0]+'" aria-pressed="'+(state.minBat===m[0])+'">'+m[1]+'</button>';
    }).join('')+'</div>';
    h += '<p class="note">'+res.cands.length+' Roller passen zu deinen Filtern.</p>';
    h += '<p><button type="button" class="btn" data-act="reset" data-k="reset">Zurücksetzen</button></p>';
    return h;
  }
  var STATUS = {live:['st-ok','Live-Feed'], ok:['st-ok','Aus Anbieter-Daten'], guess:['st','Annahme'], none:['st-none','Unbekannt'], user:['st-user','Von dir']};
  function num(v){ return v==null ? '' : v.toFixed(2).replace('.', ','); }
  function pricesHTML(){
    var h = '<div class="callout"><b>So sicher sind die Preise.</b> Für Dott und Voi stammen die Hannover-Tarife aus den offenen Anbieter-Daten. Für Lime und Bolt habe ich keinen Hannover-Preis gefunden, dort steht eine Annahme. Du kannst jeden Preis ändern, wenn du ihn in der App siehst. Dann rechnet RollerCheck damit.</div>';
    h += '<h3>Preise pro Anbieter</h3><div class="group">'+P.map(function(p){
      var s = STATUS[p.conf];
      return '<div class="prow"><div class="pr-top"><i class="dot" style="background:'+p.color+'"></i><b>'+p.name+'</b><span class="st '+s[0]+'" id="st-'+p.id+'">'+s[1]+'</span></div>'
        +'<div class="pr-in"><label>Entsperren (€)<input inputmode="decimal" autocomplete="off" data-pid="'+p.id+'" data-f="unlock" value="'+num(p.unlock)+'" placeholder="–"></label>'
        +'<label>Pro Minute (€)<input inputmode="decimal" autocomplete="off" data-pid="'+p.id+'" data-f="perMin" value="'+num(p.perMin)+'" placeholder="–"></label></div>'
        +'<p class="nt">'+p.note+'</p></div>';
    }).join('')+'</div>';
    h += '<p><button type="button" class="btn" data-act="resetprices" data-k="resetprices">Auf Standard zurücksetzen</button></p>';
    h += '<h3>Anbieter in Hannover</h3><p class="note" style="margin-top:0">Die Stadt nennt Bolt, Dott, Lime, Voi und Ryde. Ab Ende 2026 will sie per Ausschreibung höchstens drei Anbieter zulassen, die Liste kann sich also ändern.</p>';
    h += '<h3>Quellen</h3><ul class="srcs">'
      +'<li><a href="https://scootradar.com/de/ratgeber/e-scooter-hannover" target="_blank" rel="noopener">scootradar.com: E-Scooter Hannover</a></li>'
      +'<li><a href="https://www.dealdoktor.de/magazin/e-scooter-sharing-anbieter-deals-gutscheine/" target="_blank" rel="noopener">dealdoktor.de: Anbieter und Preise</a></li>'
      +'<li><a href="https://escooter-held.de/anbieter/bolt/" target="_blank" rel="noopener">escooter-held.de: Bolt</a></li>'
      +'<li><a href="https://www.hannover.de/Service/Presse-Medien/Hannover.de/Aktuelles/Service-2019/E-Scooter-in-Hannover" target="_blank" rel="noopener">hannover.de: E-Scooter in Hannover</a></li>'
      +'<li><a href="https://www.hannover.de/Service/Presse-Medien/Landeshauptstadt-Hannover/Aktuelle-Meldungen-und-Veranstaltungen/Hannover-regelt-E-Scooter-Betrieb-neu" target="_blank" rel="noopener">hannover.de: neue Regeln für E-Scooter</a></li></ul>';
    h += '<h3>So wird gerechnet</h3><p class="note" style="margin-top:0"><b>Preis</b> = Entsperren + Fahrminuten × Minutenpreis. <b>Zeit</b> = Fußweg (5 km/h) + Fahrt (16 km/h), jeweils Luftlinie mit Umwegfaktor. <b>Score 100</b> heißt: Bei dem, was du sortierst, ist dieser Roller der beste in Reichweite. Bei „Bester Mix“ zählen Preis und Zeit gleich viel.</p>';
    return h;
  }
  function renderSheet(){
    var ae = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    var keep = sbody.scrollTop, sameView = sbody.dataset.view === state.view;
    shead.innerHTML = headHTML();
    sbody.innerHTML = state.view==='results' ? resultsHTML() : (state.view==='filter' ? filterHTML() : pricesHTML());
    sbody.dataset.view = state.view;
    sbody.scrollTop = sameView ? keep : 0;
    if(ae){ var el = sheet.querySelector('[data-k="'+ae+'"]'); if(el) el.focus({preventScroll:true}); }
  }

  /* Bedienung im Blatt */
  sheet.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var a = b.dataset.act;
    if(a==='sel'){ state.sel = +b.dataset.id; update(false); }
    else if(a==='sort'){ state.sort = b.dataset.v; update(false); }
    else if(a==='filter'){ state.view = 'filter'; renderSheet(); }
    else if(a==='prices'){ state.view = 'prices'; renderSheet(); }
    else if(a==='back'){ state.view = 'results'; renderSheet(); }
    else if(a==='toggle'){ state.provs[b.dataset.id] = !state.provs[b.dataset.id]; update(false); }
    else if(a==='walk'){ state.maxWalk = +b.dataset.v; update(false); }
    else if(a==='bat'){ state.minBat = +b.dataset.v; update(false); }
    else if(a==='reset'){ state.provs = {dott:true, voi:true, lime:true, bolt:true, ryde:true}; state.maxWalk = 12; state.minBat = 0; update(false); }
    else if(a==='resetprices'){
      P.forEach(function(p){ p.unlock = p.def.unlock; p.perMin = p.def.perMin; p.conf = p.def.conf; });
      recompute(); renderSheet();
    }
  });
  sheet.addEventListener('input', function(e){
    var t = e.target; if(!t.dataset || !t.dataset.pid) return;
    var p = pById(t.dataset.pid), raw = t.value.replace(',', '.').trim(), v = raw==='' ? null : parseFloat(raw);
    if(v!=null && (isNaN(v) || v<0)) return;
    p[t.dataset.f] = v;
    p.conf = (p.unlock===p.def.unlock && p.perMin===p.def.perMin) ? p.def.conf : 'user';
    var s = STATUS[p.conf], el = $('#st-'+p.id);
    if(el){ el.className = 'st '+s[0]; el.textContent = s[1]; }
    recompute();
  });

  /* Blatt ziehen (Handy) */
  function layoutSheet(){
    if(isDesk()){ sheet.style.height = ''; return; }
    var ah = app.clientHeight, sb = search.getBoundingClientRect(), ar = app.getBoundingClientRect();
    DET.peek = 150;
    DET.full = Math.round(ah-(sb.bottom-ar.top)-12);
    DET.mid = Math.min(Math.max(300, Math.round(ah*0.46)), DET.full-60);
    sheetH = DET[detent]; sheet.style.height = sheetH+'px';
  }
  function setDetent(d){ detent = d; sheetH = DET[d]; sheet.style.height = sheetH+'px'; }
  var drag = null;
  $('#stop').addEventListener('pointerdown', function(e){
    if(isDesk() || e.target.closest('button:not(.grab)')) return;
    drag = {y:e.clientY, h:sheetH, moved:false, id:e.pointerId};
    try{ $('#stop').setPointerCapture(e.pointerId); }catch(_){}
  });
  $('#stop').addEventListener('pointermove', function(e){
    if(!drag || e.pointerId!==drag.id) return;
    var dy = drag.y-e.clientY;
    if(Math.abs(dy) > 4) drag.moved = true;
    if(drag.moved){
      sheet.classList.add('dragging');
      sheetH = Math.max(DET.peek, Math.min(DET.full, drag.h+dy));
      sheet.style.height = sheetH+'px';
    }
  });
  function endDrag(e){
    if(!drag || e.pointerId!==drag.id) return;
    var moved = drag.moved; drag = null;
    sheet.classList.remove('dragging');
    if(!moved) return;
    var best = 'mid', bd = 1e9;
    ['peek','mid','full'].forEach(function(k){ var d = Math.abs(DET[k]-sheetH); if(d<bd){ bd = d; best = k; } });
    setDetent(best);
  }
  $('#stop').addEventListener('pointerup', endDrag);
  $('#stop').addEventListener('pointercancel', endDrag);
  $('#grab').addEventListener('click', function(){
    if(isDesk()) return;
    setDetent(detent==='peek' ? 'mid' : (detent==='mid' ? 'full' : 'mid'));
  });

  /* Karte: ziehen, zoomen (Mausrad, zwei Finger), tippen */
  var ptrs = {}, moved = false, downAt = null, prevD = 0, prevMid = null;
  function plist(){ return Object.keys(ptrs).map(function(k){ return ptrs[k]; }); }
  function tap(e){
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var gEl = el && el.closest ? el.closest('[data-id]') : null;
    if(gEl && svg.contains(gEl)){ state.sel = +gEl.dataset.id; update(false); return; }
    var c = c2s(e.clientX, e.clientY);
    if(state.active==='start'){ state.start = c; state.startLabel = 'Dein Standort'; }
    else { state.dest = c; state.destLabel = 'Gewähltes Ziel'; }
    update(true);
  }
  svg.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
    var p = plist();
    if(p.length===1){ downAt = {x:e.clientX, y:e.clientY}; moved = false; }
    else if(p.length===2){
      moved = true;
      prevD = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      prevMid = [(p[0].x+p[1].x)/2, (p[0].y+p[1].y)/2];
    }
  });
  svg.addEventListener('pointermove', function(e){
    var q = ptrs[e.pointerId]; if(!q) return;
    var n = plist().length;
    if(n===1){
      if(!moved && downAt && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6) moved = true;
      if(moved){ view.cx -= (e.clientX-q.x)/view.s; view.cy -= (e.clientY-q.y)/view.s; clampView(); draw(); }
      q.x = e.clientX; q.y = e.clientY;
    } else if(n>=2){
      q.x = e.clientX; q.y = e.clientY;
      var p = plist();
      var d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y), mid = [(p[0].x+p[1].x)/2, (p[0].y+p[1].y)/2];
      if(prevD > 0){
        var c = c2s(mid[0], mid[1]);
        zoomAt(d/prevD, c[0], c[1], true);
        view.cx -= (mid[0]-prevMid[0])/view.s; view.cy -= (mid[1]-prevMid[1])/view.s;
        clampView(); draw();
      }
      prevD = d; prevMid = mid;
    }
  });
  function endPtr(e){
    if(!ptrs[e.pointerId]) return;
    var n = plist().length;
    delete ptrs[e.pointerId];
    if(n===1 && !moved && e.type==='pointerup') tap(e);
    if(plist().length===1) moved = true;
  }
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  svg.addEventListener('wheel', function(e){
    e.preventDefault();
    var c = c2s(e.clientX, e.clientY);
    zoomAt(Math.exp(-e.deltaY*0.002), c[0], c[1]);
  }, {passive:false});

  /* ---------- Alles zusammen ---------- */
  function recompute(){
    res = compute();
    if(!res.best.some(function(b){ return b.s.id===state.sel; })) state.sel = res.best.length ? res.best[0].s.id : null;
    draw();
  }
  function update(refit, noLive){
    res = compute();
    if(!res.best.some(function(b){ return b.s.id===state.sel; })) state.sel = res.best.length ? res.best[0].s.id : null;
    syncSearch();
    if(refit) fitView();
    draw();
    renderSheet();
    if(refit && !noLive && live.on) scheduleLive();
  }

  var rz = 0;
  function onResize(){ cancelAnimationFrame(rz); rz = requestAnimationFrame(function(){ layoutSheet(); draw(); }); }
  if(window.ResizeObserver) new ResizeObserver(onResize).observe(app); else window.addEventListener('resize', onResize);
  window.matchMedia('(min-width:900px)').addEventListener('change', function(){ layoutSheet(); update(true); });

  /* ---------- Live-Daten vom Server (/api/scooters) ---------- */
  var live = {on:false, ok:{}, at:null, names:[]};
  var apiBase = new URLSearchParams(location.search).get('api') || '';
  var idMap = {}, idN = 0, liveTimer = 0;
  function toLatLng(x, y){ return [BB.latMax-(y/H)*(BB.latMax-BB.latMin), BB.lngMin+(x/W)*(BB.lngMax-BB.lngMin)]; }
  function appHref(s, p){
    var u = s.uris, ua = navigator.userAgent || '';
    if(u){
      if(/iPhone|iPad|iPod/i.test(ua) && u.ios) return u.ios;
      if(/Android/i.test(ua) && u.android) return u.android;
      if(u.web) return u.web;
    }
    return p.url;
  }
  function loadLive(refit){
    var ll = toLatLng(state.start[0], state.start[1]);
    return fetch(apiBase+'/api/scooters?lat='+ll[0].toFixed(5)+'&lng='+ll[1].toFixed(5)+'&radius=1600', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){
        var ok = {}, names = [];
        Object.keys(d.providers).forEach(function(id){
          var pr = d.providers[id], p = pById(id);
          if(!p || pr.status!=='ok') return;
          ok[id] = true; names.push(p.name);
          if(pr.pricing && p.conf!=='user'){
            p.unlock = pr.pricing.unlock; p.perMin = pr.pricing.perMin; p.conf = 'live';
            p.def = {unlock:p.unlock, perMin:p.perMin, conf:'live'};
          }
        });
        if(!names.length) return; /* kein Feed erreichbar: Demo bleibt */
        scooters = d.scooters.filter(function(s){ return ok[s.p]; }).map(function(s){
          if(!idMap[s.id]) idMap[s.id] = ++idN;
          return {id:idMap[s.id], xy:toXY(s.lat, s.lon), p:pById(s.p), bat:s.bat, uris:s.uris};
        });
        live = {on:true, ok:ok, at:new Date(d.generatedAt), names:names};
        update(refit, true);
      })
      .catch(function(){ /* ohne Server bleibt die Demo */ });
  }
  function scheduleLive(){ clearTimeout(liveTimer); liveTimer = setTimeout(function(){ loadLive(false); }, 250); }

  syncSearch();
  layoutSheet();
  update(true);
  loadLive(true);
  setInterval(function(){ if(!document.hidden) loadLive(false); }, 30000);
})();
</script>
